<a class="skip-link" href="#conteudo" (click)="skipToContent($event)">Pular para o conteúdo</a>

<header>
  <!-- Barra Superior -->
  <div class="top-bar">
    <span>Universidade Tecnológica Federal do Paraná</span>
    <!-- Substituído o @ por &#64; para não conflitar com o Angular -->
    <span>contato&#64;hitech.org.br</span>
  </div>

  <!-- Navegação Principal -->
  <nav>
    <a class="logo" routerLink="/" aria-label="Hi Tech, página inicial">
      <img [src]="templateText.LogoEmpresa.src" alt="" />
    </a>
    
    <ul class="nav-links">
      <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a></li>
      <li><a routerLink="/about" routerLinkActive="active">Sobre Nós</a></li>
      <li><a routerLink="/services" routerLinkActive="active">Serviços</a></li>
      <li><a routerLink="/contact" routerLinkActive="active">Contato</a></li>
    </ul>
  </nav>
</header>

<main id="conteudo" tabindex="-1">
  <ng-content></ng-content>
</main>
