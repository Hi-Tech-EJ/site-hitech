<div class="scroll-container">

  <section id="hero">
    <div class="hero-content">
      <div class="hero-left">
        <div class="hero-header">
          <h1 class="typed-text hero-title">{{ templateText.heroTitle }}</h1>
          <p class="hero-description-fallback">{{ templateText.heroDescription }}</p>
        </div>
      </div>

      <div class="hero-right">
        <div class="team-card-wrapper">
          <div class="team-card">
            <div class="image-container">
              <img
                [src]="templateText.heroImage.src"
                [attr.srcset]="templateText.heroImage.srcset"
                [attr.sizes]="templateText.heroImage.sizes"
                [alt]="templateText.heroImage.alt"
                width="1600"
                height="900"
                fetchpriority="high"
                decoding="async" />
            </div>
            <div class="team-caption">
              <span>{{ templateText.heroImage.caption }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section id="about">
    <div class="about-content">
      <div class="about-left">
        <div class="about-header">
          <span class="about-subtitle">{{ templateText.about.subTitle }}</span>
          <h2 class="typed-text about-title">{{ templateText.about.title }}</h2>
          <p class="about-description">{{ templateText.about.description }}</p>
        </div>
      </div>
      <div class="about-right">
        <div class="about-card-wrapper">
          <div class="activity-card">
            <ul>
              <li *ngFor="let item of templateText.about.activity">
                {{ item }}
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </section>

</div>
