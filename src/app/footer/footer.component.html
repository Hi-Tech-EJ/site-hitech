<footer>
  <div class="footer-container">
    <div class="footer-brand">
      <img class="footer-logo" src="assets/thiago-logo.svg" alt="Thiago Macedo" />
      <p class="footer-tagline">Estudante de Engenharia de Computação · UTFPR</p>
    </div>

    <nav class="footer-col" aria-label="Rodapé">
      <h2 class="footer-heading">Navegação</h2>
      <ul>
        <li><a href="#hero">Início</a></li>
        <li><a href="#about">Sobre</a></li>
      </ul>
    </nav>

    <div class="footer-col">
      <h2 class="footer-heading">Minhas Redes</h2>
      <ul>
        <li><a href="mailto:thiago.macedo@hitech.org.br">thiago.macedo&#64;hitech.org.br</a></li>
        <li *ngFor="let rede of templateText.RedesSociais">
          <a [href]="rede.url" target="_blank" rel="noopener noreferrer" class="social-link">
            <img [src]="rede.icon" alt="" aria-hidden="true" class="social-icon" />
            <span>{{ rede.nome }}<span class="sr-only"> (abre em nova aba)</span></span>
          </a>
        </li>
      </ul>
    </div>
  </div>

  <div class="footer-bottom">
    <p>&copy; {{ currentYear }} Thiago Macedo dos Reis. Todos os direitos reservados.</p>
    <p>UTFPR &middot; Curitiba, PR</p>
  </div>
</footer>
