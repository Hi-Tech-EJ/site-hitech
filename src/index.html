<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Carolina | Portfólio de Desenvolvimento Web</title>
    <base href="/" />
    <script>document.documentElement.classList.add("js")</script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- SEO básico -->
    <meta
      name="description"
      content="Portfólio pessoal da Carolina: estudante de tecnologia, projetos de desenvolvimento web, trajetória acadêmica e hobbies."
    />
    <meta
      name="keywords"
      content="portfólio, desenvolvedora, Angular, desenvolvimento web, Curitiba, UTFPR"
    />
    <meta name="author" content="Carolina" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://carolina-portfolio.example.com/" />

    <!-- Open Graph (WhatsApp, LinkedIn, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Carolina" />
    <meta property="og:title" content="Carolina | Portfólio de Desenvolvimento Web" />
    <meta
      property="og:description"
      content="Conheça meus projetos, minha trajetória e entre em contato."
    />
    <meta property="og:url" content="https://carolina-portfolio.example.com/" />
    <!-- Imagem da prévia ao compartilhar o link (WhatsApp, LinkedIn etc).
         Arte 1200x630 em src/assets/og-image.png. -->
    <meta property="og:image" content="https://carolina-portfolio.example.com/assets/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Portfólio da Carolina, estudante de tecnologia" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter / X (title e description são atualizados por rota no SeoService) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Carolina | Portfólio de Desenvolvimento Web" />
    <meta
      name="twitter:description"
      content="Conheça meus projetos, minha trajetória e entre em contato."
    />
    <meta name="twitter:image" content="https://carolina-portfolio.example.com/assets/og-image.png" />

    <link rel="icon" type="image/png" href="assets/logo.ico" />
    <link rel="shortcut icon" href="assets/logo.ico" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/devicon@2.16.0/devicon.min.css" />

    <!-- Preload das fontes principais para reduzir o tempo de renderização do texto -->
    <link
      rel="preload"
      href="assets/fonts/RubikMonoOne-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="assets/fonts/RobotoMono-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />

    <!-- Dados estruturados (Schema.org) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "@id": "https://carolina-portfolio.example.com/#person",
        "name": "Carolina",
        "url": "https://carolina-portfolio.example.com/",
        "email": "soultcarolina@gmail.com",
        "jobTitle": "Estudante de tecnologia",
        "address": { "@type": "PostalAddress", "addressLocality": "Curitiba", "addressRegion": "PR", "addressCountry": "BR" }
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
