server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Se o nginx precisar redirecionar, usa caminho relativo. Atrás de um
    # proxy HTTPS, um redirect absoluto sairia como http://... porque este
    # container só enxerga a porta 80.
    absolute_redirect off;

    # =====================================================================
    # Compressão
    # O nginx vem com gzip DESLIGADO por padrão. Sem isto o main.js é
    # servido com ~505 KB em vez de ~144 KB — na medição com Lighthouse
    # isso sozinho valeu 14 pontos de performance.
    # =====================================================================
    gzip on;
    gzip_vary on;          # sinaliza a caches/CDNs que a resposta varia por Accept-Encoding
    gzip_min_length 1024;  # abaixo disso o cabeçalho do gzip custa mais do que economiza
    gzip_comp_level 6;     # equilíbrio entre CPU e tamanho final
    gzip_proxied any;
    # text/html é comprimido sempre que gzip está on, não precisa ser listado.
    # jpg/png/webp/woff2 já são formatos comprimidos: gastariam CPU sem ganho.
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml;

    # =====================================================================
    # Cache
    # =====================================================================

    # JS e CSS saem do build com hash no nome (main-XKLQ6VXF.js). Se o
    # conteúdo mudar, o nome muda junto — então podem ser cacheados para
    # sempre sem risco de o visitante ficar com versão velha.
    # A regex fica entre aspas porque o "{8}" sem aspas seria lido pelo
    # nginx como abertura de bloco (erro "unknown directive").
    location ~* "-[A-Z0-9]{8}\.(?:js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Imagens e fontes têm nome fixo, então cache mais curto: se um arquivo
    # for trocado mantendo o nome, o visitante pega a versão nova em 30 dias.
    location ~* \.(?:jpg|jpeg|png|webp|gif|svg|ico|woff2)$ {
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # A home é a raiz. O endereço antigo /home redireciona com 301 para que o
    # Google transfira o sinal para a URL canônica.
    location = /home {
        return 301 /;
    }

    # O HTML é o que aponta para os arquivos com hash novo depois de cada
    # deploy. Se ele ficar cacheado, o visitante continua carregando a
    # versão antiga do site — por isso sempre revalida.
    location / {
        add_header Cache-Control "no-cache";

        # Serve o HTML pré-renderizado de cada rota (ex: /services ->
        # /services/index.html); sem versão estática, cai no 404 abaixo.
        # Sem "$uri/" de propósito: como a pasta /services/ existe, ele
        # faria o nginx responder 301 para /services/ — e o canonical e o
        # sitemap usam a URL sem barra.
        try_files $uri $uri/index.html =404;
    }

    # Todas as rotas do site são pré-renderizadas (prerender-routes.txt), então
    # o que não casou com um arquivo é de fato inexistente. Responde com status
    # 404 real e a página /404 pré-renderizada, em vez de 200 com o index.html
    # (soft 404, que o Google trata como página válida). Se uma rota nova for
    # criada, ela precisa entrar no prerender-routes.txt.
    error_page 404 /404/index.html;
}
